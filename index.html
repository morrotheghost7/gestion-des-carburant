<style>

a{color:var(--lk);text-decoration:none}a:hover{text-decoration:underline}

.um{position:relative}.ub{display:flex;gap:10px;align-items:center;color:#fff!important}.ub:hover{text-decoration:none}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}

.bc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px 0;font-size:12.5px;color:var(--mut)}
.tools{display:flex;gap:10px;align-items:center}

.seg a{padding:4px 14px;color:var(--tx);font-size:12.5px;font-weight:500}.seg a:hover{background:var(--hv);text-decoration:none}.seg a.on{background:var(--pri);color:var(--onp);font-weight:700}

h1::after{content:"";display:block;width:54px;height:5px;border-radius:9px;background:var(--pri);margin-top:10px}
h2{font-size:16px;font-weight:750;margin:28px 0 12px}

.st{display:inline-block;padding:2px 11px;border:1px solid;border-radius:999px;font-size:12px;font-weight:600}

 REP=[[t("veh"),t("liters"),t("amount"),t("meas"),t("usage")]].concat(rv.map(r=>[r[0],num(r[1],1),num(r[2]),r[3]?num(r[3],1):"-",num(r[4],1)+" %"]));
 const tb=(h,rows)=>"<table><tr>"+h.map((x,i)=>'<th class="'+(i?"n":"")+'">'+x+"</th>").join("")+"</tr>"+rows.map(r=>"<tr>"+r.map((c,i)=>'<td class="'+(i?"n":"")+'">'+c+"</td>").join("")+"</tr>").join("")+"</table>";
 return"<h1>"+t("reports")+'</h1><div class="bar"><input type="month" data-flt="rm" value="'+m+'"><a class="btn sec" href="#" data-a="csvrep">'+t("csv")+"</a></div><h2>"+t("byveh")+"</h2>"+tb(REP[0],REP.slice(1))+"<h2>"+t("bydept")+"</h2>"+tb([t("dept"),t("liters"),t("amount")],rd.map(r=>[r[0],num(r[1],1),dh(r[2])]))}
const late=r=>r.status=="P"&&(new Date(TD)-new Date(r.date))/864e5>=3;
function remind(){let ch=0;db.reqs.filter(r=>late(r)&&!r.rem).forEach(r=>{r.rem=ch=1;const d=Math.floor((new Date(TD)-new Date(r.date))/864e5);db.users.filter(u=>u.role!="EMPLOYEE"&&u.on).forEach(u=>notify(u.id,"n_late",{no:r.no,d},"req/"+r.id))});if(ch)save()}
function bars(ls,vs){const n=vs.length,mx=Math.max(...vs,1),g=440/n,w=Math.min(60,g*.6);let s='<svg viewBox="0 0 480 220" width="100%" style="max-width:520px;direction:ltr;background:#fff;border:1px solid #cfd6df" role="img"><line x1="20" y1="180" x2="470" y2="180" stroke="#cfd6df"/>';
 vs.forEach((v,i)=>{const h=Math.round(v/mx*140),x=30+i*g+(g-w)/2,c=x+w/2;s+='<rect x="'+x+'" y="'+(180-h)+'" width="'+w+'" height="'+h+'" fill="#2557d6" rx="3"/><text x="'+c+'" y="'+(172-h)+'" text-anchor="middle" font-size="11" fill="#1d2733">'+num(v,v>999?0:1)+'</text><text x="'+c+'" y="198" text-anchor="middle" font-size="11" fill="#6b7785">'+ls[i]+"</text>"});return s+"</svg>"}
function chart(k){const ms=[];for(let i=5;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);ms.push(d.getFullYear()+"-"+p2(d.getMonth()+1))}
 return bars(ms.map(m=>m.slice(5)+"/"+m.slice(0,4)),ms.map(m=>db.fuel.filter(f=>f.date.startsWith(m)).reduce((s,f)=>s+(k?f.liters*f.price:f.liters),0)))}
function vHist(id){const v=db.vehicles.find(x=>x.id==id);if(!v)return den();delete ST.vh;
 const fs=db.fuel.filter(f=>f.veh==v.id).sort((a,b)=>a.odo-b.odo),cs=fs.map(cons),ok=cs.filter(Boolean),kp=(a,b)=>"<div><span>"+t(a)+"</span><b>"+b+"</b></div>";
 return"<h1>"+t("hist")+" - "+v.plate+" - "+esc(v.model)+'</h1><div class="kp">'+kp("tl",num(fs.reduce((s,f)=>s+f.liters,0),1)+" L")+kp("tc",dh(fs.reduce((s,f)=>s+f.liters*f.price,0)))+kp("ka",ok.length?num(ok.reduce((a,b)=>a+b,0)/ok.length,1):"-")+kp("lo",num(fs.length?fs[fs.length-1].odo:v.odo0,0)+" km")+"</div><h2>"+t("meas")+" (L/100 km) - "+t("normal")+" "+num(v.l100,1)+"</h2>"+bars(fs.slice(-8).map(f=>f.date.slice(8)+"/"+f.date.slice(5,7)),cs.slice(-8).map(c=>c||0))+"<h2>"+t("fuel")+"</h2>"+list("vh",["date","station","#liters","#price","#amount","#odo","#meas","status"],fs.slice().reverse(),f=>{const c=cons(f),an=c&&c>=v.l100*1.15;return[fd(f.date),f.station,num(f.liters,1),num(f.price),dh(f.liters*f.price),num(f.odo,0),c?num(c,1):"-",an?'<span class="st R">'+t("flag")+"</span>":'<span class="st A">'+t("ok2")+"</span>"]})+'<p><a href="#/vehicles">'+t("vehicles")+"</a></p>"}
const AC={
 lang:d=>{L=d.v;LS.setItem("gc_l",L);render()},
 logout:()=>{me=null;LS.removeItem("gc_me");location.hash="";render()},
 pg:d=>{ST[d.id].p=+d.p;$("tb-"+d.id).innerHTML=LV[d.id]()},
 print:()=>window.print(),
 approve:d=>{if(!can(me.role,"req.decide"))return;const r=db.reqs.find(x=>x.id==d.id);r.status="A";r.by=me.id;notify(r.user,"n_ok",{no:r.no},"req/"+r.id);lg("a_ok",r.no);flash="saved";location.hash="#/all";render()},
 toggle:d=>{const u=db.users.find(x=>x.id==d.id);u.on=u.on?0:1;lg("a_user",u.login);render()},
 delreq:d=>{const r=db.reqs.find(x=>x.id==d.id);if(!r||r.status!="P"||r.user!=me.id)return;db.reqs=db.reqs.filter(x=>x.id!=r.id);db.notifs=db.notifs.filter(n=>n.link!="req/"+r.id);save();render()},
 menu:()=>{document.querySelector(".um").classList.toggle("open")},
 demo:d=>{const f=document.querySelector("form[data-f=login]");f.querySelector("[name=ident]").value=d.u;f.querySelector("[name=pass]").value=DEMO[d.u]},
 theme:()=>{TH=TH=="dark"?"light":"dark";LS.setItem("gc_th",TH);render()},
 csvrep:()=>dl("rapport-"+(FL.rm||TD.slice(0,7))+".csv",REP),
 csvfuel:()=>dl("alimentations.csv",[[t("date"),t("plate"),t("station"),t("liters"),t("price"),t("amount"),t("odo")]].concat(db.fuel.map(f=>[fd(f.date),veh(f.veh).plate,f.station,num(f.liters,1),num(f.price),num(f.liters*f.price),f.odo]))),
 bkp:()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="sauvegarde-carburants.json";a.click()},
 delveh:d=>{db.vehicles=db.vehicles.filter(v=>v.id!=d.id);save();render()},
 reset:()=>{if(!can(me.role,"reset"))return;LS.removeItem(KEY);seed();me=db.users[0];remind();lg("a_reset");location.hash="#/budget";render()},
 csv:()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[[t("no"),t("date"),t("emp"),t("plate"),t("ftype"),t("liters"),t("status"),t("reason")]].concat(curReq.map(r=>[r.no,fd(r.date),usr(r.user).name,veh(r.veh).plate,ft(r.fuel),num(r.liters,1),t(r.status),r.reason])),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\n")],{type:"text/csv"}));a.download="demandes.csv";a.click()}};
document.addEventListener("click",e=>{flash="";if(!e.target.closest("[data-a=menu]"))document.querySelectorAll(".um.open").forEach(x=>x.classList.remove("open"));const sb=e.target.closest("[data-sub]");if(sb){e.preventDefault();doSubmit(sb.closest("form"));return}const ln=e.target.closest('a[href^="#/"]');if(ln){e.preventDefault();location.hash=ln.getAttribute("href");return}const a=e.target.closest("[data-a]");if(!a)return;e.preventDefault();AC[a.dataset.a]&&AC[a.dataset.a](a.dataset)});
document.addEventListener("input",e=>{const i=e.target.dataset.s;if(!i)return;ST[i].q=e.target.value;ST[i].p=1;$("tb-"+i).innerHTML=LV[i]()});
document.addEventListener("change",e=>{if(e.target.id=="imp"&&can(me.role,"reset")){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.reqs||!d.vehicles||!d.fuel||!d.set)throw 0;db=d;me=db.users.find(u=>u.id==me.id&&u.on)||db.users[0];save();lg("a_import");flash="imp_ok"}catch(x){flash="imp_ko"}render()};r.readAsText(e.target.files[0]);return}
 flash="";const k=e.target.dataset.flt;if(!k)return;FL[k]=e.target.value;if(ST.rall)ST.rall.p=1;render()});
function doSubmit(form){const f=form&&form.dataset.f;if(!f)return;flash="";const v={};new FormData(form).forEach((x,k)=>v[k]=String(x).trim());const er=H[f](v);if(er&&Object.keys(er).length){F[f]={v,e:er}}else{F={};save()}render()}
document.addEventListener("submit",e=>{e.preventDefault();doSubmit(e.target)});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.tagName=="INPUT"&&e.target.form&&e.target.form.dataset.f){e.preventDefault();doSubmit(e.target.form)}});
window.addEventListener("hashchange",()=>{F={};render()});
load();render();
